[build-system]
requires = ["setuptools>=59.6.0", "wheel>=0.37.1"]
build-backend = "setuptools.build_meta"

[project]
name = "salary-prediction"
version = "1.0.0"
description = "Salary Prediction Web Application"
readme = "README.md"
requires-python = ">=3.9, <3.10"
classifiers = [
    "Programming Language :: Python :: 3.9",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "flask==2.0.3",
    "pandas==1.3.5",
    "numpy==1.21.6",
    "scikit-learn==1.0.2",
    "joblib==1.1.0",
    "matplotlib==3.5.3",
    "seaborn==0.11.2",
    "gunicorn==20.1.0",
    "Werkzeug==2.0.3",
    "scipy==1.7.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black>=21.12b0",
    "flake8>=4.0.1",
]

[project.urls]
Homepage = "https://github.com/shourya9058/Employee-Salary-Prediction"
