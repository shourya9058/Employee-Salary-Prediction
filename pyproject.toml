[build-system]
requires = ["setuptools>=59.6.0", "wheel>=0.37.1"]
build-backend = "setuptools.build_meta"

[project]
name = "salary-prediction"
version = "1.0.0"
description = "Salary Prediction Web Application"
readme = "README.md"
requires-python = ">=3.10, <3.11"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "flask==2.0.3",
    "pandas==1.5.3",
    "numpy==1.23.5",
    "scikit-learn==1.2.2",
    "joblib==1.2.0",
    "matplotlib==3.7.1",
    "seaborn==0.12.2",
    "gunicorn==20.1.0",
    "Werkzeug==2.0.3",
    "scipy==1.10.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black>=21.12b0",
    "flake8>=4.0.1",
]

[project.urls]
Homepage = "https://github.com/shourya9058/Employee-Salary-Prediction"
